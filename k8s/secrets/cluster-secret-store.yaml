# Points at the "secrets-source" namespace as if it were an external secret
# manager. In production this would be a ClusterSecretStore with
# `provider.aws.secretsManager` and an IRSA role instead - see
# docs/runbooks/secret-management.md.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: secrets-source-store
spec:
  provider:
    kubernetes:
      remoteNamespace: secrets-source
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: secrets-source
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-reader
          namespace: secrets-source
