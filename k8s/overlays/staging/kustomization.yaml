apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

images:
  - name: advanced-api
    newName: advanced-api
    newTag: local
  - name: advanced-worker
    newName: advanced-worker
    newTag: local

configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
  - name: worker-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - POLL_INTERVAL_MS=4000

patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 64Mi }
          limits: { cpu: 250m, memory: 128Mi }
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 150m, memory: 96Mi }
